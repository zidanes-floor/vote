name: Sync FPL data and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # every hour
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull FPL data
        id: sync
        continue-on-error: true
        run: node scripts/sync.mjs && python3 scripts/build.py

      - name: Save the new data to the repo
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/fpl.json raw/xp_solio.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Sync FPL data"
            git pull --rebase origin main && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
