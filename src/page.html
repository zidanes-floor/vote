<title>Zidane's Floor Squad Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: the club's 16 managers as a 4×4 lit dance floor up top (brightness = GW score), a sticky tab bar,
   then one working view at a time (Table, Lineups, Squads, Compare, Ownership); a manager opens in a side sheet where the next-GW lineup is edited or read from a screenshot. */
/* One dark theme, taken from the club crest: night-sky indigo surfaces, orchid/magenta accent (the crest lettering),
   with the dance-floor pink, cyan and yellow used for the floor tiles and chart series. */
:root {
  --bg: #0B0920; --surface: #141130; --surface-2: #1E1944; --tile: #201A48;
  --ink: #F4F0FF; --ink-2: #CDC5EE; --muted: #9A92C6; --line: #2E2760;
  --accent: #E384F2; --accent-strong: #D35FE4; --accent-soft: #33194E; --on-accent: #17051F;
  --neon-pink: #EF2185; --neon-cyan: #29B6FC; --neon-yellow: #F8C455; --neon-violet: #8D6BE8;
  --series-a: #D74F9C; --series-b: #2B98DA; --spark: #4A4380;
  --good: #4ADE9A; --warn: #F8C455; --bad: #FF6474;
  --pitch-a: #120E2B; --pitch-b: #171236; --pitch-line: #3A2C6E;
  --fdr1-bg: #2E9E68; --fdr1-fg: #03140B; --fdr2-bg: #1F4A35; --fdr2-fg: #BDEBD1;
  --fdr3-bg: #2E2760; --fdr3-fg: #CDC5EE; --fdr4-bg: #5A3414; --fdr4-fg: #F8C894;
  --fdr5-bg: #D4483A; --fdr5-fg: #1A0402;
  --shadow: 0 1px 2px rgb(0 0 0 / .35), 0 14px 36px rgb(4 2 16 / .55);
  --glow: 0 0 0 1px rgb(211 95 228 / .35), 0 0 18px rgb(211 95 228 / .25);
  --f-display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
/* Dropdown lists: Windows/Chrome draws the open list with its own light background unless the options are styled, which hid the light text. */
select { color-scheme: dark; }
select option, select optgroup { background-color: var(--surface-2); color: var(--ink); }
select option:disabled { color: var(--muted); }
select option:checked { background-color: var(--accent-soft); color: var(--ink); }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Hero / floor ---------- */
/* Full-bleed night sky behind the hero, with the crest's horizon glow and a neon floor line at the bottom. */
.sky { position: relative; isolation: isolate;
  background:
    radial-gradient(1.5px 1.5px at 8% 18%, rgb(255 255 255 / .7), transparent 60%),
    radial-gradient(1px 1px at 23% 64%, rgb(255 255 255 / .55), transparent 60%),
    radial-gradient(1.5px 1.5px at 41% 12%, rgb(255 255 255 / .6), transparent 60%),
    radial-gradient(1px 1px at 57% 38%, rgb(255 255 255 / .5), transparent 60%),
    radial-gradient(1.5px 1.5px at 71% 9%, rgb(255 255 255 / .65), transparent 60%),
    radial-gradient(1px 1px at 86% 30%, rgb(255 255 255 / .5), transparent 60%),
    radial-gradient(1px 1px at 94% 72%, rgb(255 255 255 / .45), transparent 60%),
    radial-gradient(1px 1px at 33% 86%, rgb(255 255 255 / .4), transparent 60%),
    radial-gradient(90% 60% at 50% 125%, rgb(239 33 133 / .30), transparent 70%),
    radial-gradient(40% 70% at 12% 40%, rgb(211 95 228 / .16), transparent 70%),
    linear-gradient(180deg, #05031A 0%, #0D0A2E 55%, #23104E 100%); }
.sky::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--neon-cyan), var(--accent-strong) 35%, var(--neon-pink) 65%, var(--neon-yellow)); box-shadow: 0 0 14px rgb(239 33 133 / .55); }
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "crest info floor"; gap: 28px 32px; align-items: center; padding-block: 26px 28px; }
.hero > .info { grid-area: info; min-width: 0; }
.crest { grid-area: crest; display: block; line-height: 0; }
.crest img { display: block; width: clamp(190px, 21vw, 280px); height: auto; filter: drop-shadow(0 0 22px rgb(211 95 228 / .38)) drop-shadow(0 10px 24px rgb(0 0 0 / .45)); }
.wordmark { font-family: var(--f-display); font-weight: 900; text-transform: uppercase; font-size: clamp(32px, 4.3vw, 56px); line-height: .9; letter-spacing: .01em; margin: 10px 0 18px; text-wrap: balance;
  color: var(--accent); text-shadow: -.035em .05em 0 #2B7FD6, 0 0 26px rgb(211 95 228 / .35); }
.wordmark span { color: inherit; }
.status { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.gold { background: var(--accent-soft); color: var(--accent); }
.pill.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.clubstats { display: grid; grid-template-columns: repeat(3, minmax(0, max-content)); gap: 10px 32px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .v small { font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.stat .who { font-size: 13px; color: var(--ink-2); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.floorwrap { grid-area: floor; display: grid; gap: 8px; justify-items: center; }
.floor { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: min(100%, 392px); transform: perspective(1100px) rotateX(13deg); transform-origin: 50% 100%; }
.tile { --h: 0; position: relative; aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 7px; padding: 7px 8px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; min-width: 0;
  background: var(--tc, var(--tile)); color: var(--tt, var(--ink));
  box-shadow: inset 0 0 0 1px rgb(255 255 255 / .06), 0 0 calc(var(--h) * var(--h) * 28px) var(--tg, transparent);
  transition: transform .18s ease, filter .18s ease; }
.tile:hover { transform: translateY(-3px); filter: brightness(1.06); }
.tile .rk { font-size: 10.5px; font-weight: 700; opacity: .7; font-variant-numeric: tabular-nums; }
.tile .nm { display: block; font-size: 11.5px; font-weight: 600; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.tile .pt { display: block; font-family: var(--f-display); font-weight: 900; font-size: clamp(22px, 5.6vw, 32px); line-height: .9; font-variant-numeric: tabular-nums; }
.tile > span:last-child { min-width: 0; display: block; }
.tile.empty { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); box-shadow: none; cursor: default; }
.tile.empty:hover { transform: none; filter: none; }
.floorcap { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .floor .tile { animation: lightup .7s ease both; animation-delay: calc(var(--i) * 45ms); }
  @keyframes lightup { from { filter: brightness(.55) saturate(.4); } to { filter: none; } }
}

/* ---------- Banner ---------- */
.banner { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); margin-bottom: 16px; font-size: 14px; }
.banner b { color: var(--accent); }

/* ---------- Tabs ---------- */
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgb(11 9 32 / .92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.tabbar .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding-block: 0; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 14px 12px 11px; font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent-strong); text-shadow: 0 0 14px rgb(211 95 228 / .55); }
.tab:hover { color: var(--ink); }
.tabtools { display: flex; align-items: center; gap: 8px; padding-block: 6px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); box-shadow: 0 0 16px rgb(211 95 228 / .35); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

main { padding-block: 22px 64px; }
.viewhead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.viewhead h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: .02em; margin: 0; line-height: 1; }
.viewhead p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; max-width: 62ch; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
.field input, .field select { border: 0; background: none; padding: 8px 0; outline: none; min-width: 0; }
.field select { padding-right: 4px; }
.field:focus-within { border-color: var(--accent-strong); }
label.lbl { font-size: 12.5px; color: var(--muted); }

.empty-state { padding: 40px 20px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 12px; }

/* ---------- Table view ---------- */
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.club { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px; }
table.club th { text-align: left; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.club th.r, table.club td.r { text-align: right; }
table.club td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.club tr:last-child td { border-bottom: 0; }
table.club tbody tr { cursor: pointer; }
table.club tbody tr:hover { background: var(--surface-2); }
.rankno { font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; width: 2ch; }
.who { min-width: 0; }
.who b { display: block; font-weight: 600; max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who span { font-size: 12.5px; color: var(--muted); }
.big { font-family: var(--f-display); font-weight: 800; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.hit { font-size: 11.5px; color: var(--bad); font-weight: 600; margin-left: 4px; }
.mv { font-size: 11.5px; font-weight: 600; margin-left: 4px; }
.mv.up { color: var(--good); } .mv.down { color: var(--bad); }
.tag { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.gold { background: var(--accent-soft); color: var(--accent); }
.tag.ok { color: var(--good); }
.spark { display: block; }
.spark rect { fill: var(--spark); }
.spark rect.last { fill: var(--accent-strong); }

.cards { display: none; gap: 10px; }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; text-align: left; width: 100%; }
.mcard .leadfig { display: grid; justify-items: end; line-height: 1; }
.mcard .leadfig small { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 3px; white-space: nowrap; }
.mcard .leadfig .mv, .mcard .leadfig .hit { margin: 0; }
table.club th.lead { color: var(--accent); }
.mcard .meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12.5px; color: var(--muted); align-items: center; }
@media (max-width: 720px) {
  .tablebox.club-t { display: none; }
  .cards { display: grid; }
}

/* ---------- Squads view ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend i { font-style: normal; }
.sqgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.sq { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: opacity .2s; }
.sq.dim { opacity: .38; }
.sq-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 12px 14px 10px; border: 0; background: none; text-align: left; width: 100%; border-bottom: 1px solid var(--line); }
.sq-head .big { grid-row: span 2; align-self: center; text-align: right; }
.sq-head .big small { display: block; font-family: var(--f-body); font-size: 11px; font-weight: 500; color: var(--muted); }
.sq-body { padding: 10px 12px 12px; display: grid; gap: 6px; background: repeating-linear-gradient(180deg, var(--pitch-a) 0 28px, var(--pitch-b) 28px 56px); flex: 1; }
.line { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; }
.line.bench { margin-top: 4px; padding-top: 8px; border-top: 1px dashed var(--pitch-line); }
.pp { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 3px 7px 3px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; line-height: 1.25; min-width: 0; }
.pp .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 11ch; font-weight: 500; }
.pp .s { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
.pp.bench { opacity: .72; }
.pp.diff { border-color: var(--accent-strong); box-shadow: inset 0 0 0 1px var(--accent-strong); }
.pp.hl { background: var(--accent-strong); color: var(--on-accent); border-color: var(--accent-strong); }
.pp.hl .s { color: var(--on-accent); }
.cv { font-size: 10px; font-weight: 800; width: 15px; height: 15px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--ink); color: var(--surface); flex: none; }
.cv.v { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); } .dot.off { background: var(--muted); }
.subi { font-size: 10px; font-weight: 800; }
.subi.in { color: var(--good); } .subi.out { color: var(--bad); }
.fx { display: inline-block; padding: 1px 5px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.fdr1 { background: var(--fdr1-bg); color: var(--fdr1-fg); } .fdr2 { background: var(--fdr2-bg); color: var(--fdr2-fg); }
.fdr3 { background: var(--fdr3-bg); color: var(--fdr3-fg); } .fdr4 { background: var(--fdr4-bg); color: var(--fdr4-fg); }
.fdr5 { background: var(--fdr5-bg); color: var(--fdr5-fg); }
.sq-foot { padding: 8px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.findres { font-size: 13.5px; color: var(--ink-2); min-height: 20px; }

/* ---------- Lineups (next GW) ---------- */
/* Always three teams per row; on narrow screens the rows swipe sideways inside their own scroller. */
.lugrid { display: grid; grid-template-columns: repeat(3, minmax(300px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; overscroll-behavior-x: contain; }
.lu3 { display: grid; grid-template-columns: repeat(3, minmax(300px, 1fr)); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; overscroll-behavior-x: contain; }
.lu3 > .lu { scroll-snap-align: start; }
@media (max-width: 720px) { .lu3 { grid-template-columns: repeat(3, 86%); } }
.pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.lu { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: opacity .2s; min-width: 0; }
.lu.dim { opacity: .38; }
.lu-sec { grid-column: 1 / -1; padding: 6px 2px 0; }
.lu-sec > div { position: sticky; left: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; width: fit-content; max-width: calc(100vw - 40px); }
.lu-sec:not(:first-child) { margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.lu-sec b { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.lu-sec span { font-size: 12.5px; color: var(--muted); }
.lu.drop { outline: 2px dashed var(--accent-strong); outline-offset: -5px; }
.lu-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: start; gap: 6px 8px; padding: 10px 12px 8px; }
.lu-name { min-width: 0; flex: 1 1 190px; display: grid; gap: 3px; }
.lu-title { border: 0; background: none; padding: 0; text-align: left; min-width: 0; display: grid; gap: 1px; }
.lu-title b { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lu-title span, .lu-who { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lu-title:hover b { color: var(--accent); }
.lu-pick { width: 100%; padding: 0 8px; }
.lu-pick select { width: 100%; font-weight: 700; font-size: 15px; padding: 6px 0; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.lu-status { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: 0 1 auto; max-width: 100%; }
.lu-proj { display: grid; grid-template-columns: 1.1fr 1.5fr 1.1fr; gap: 6px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); align-items: start; }
.lu-proj .k .tag { font-size: 10px; padding: 1px 5px; vertical-align: 1px; }
.lu-proj > div { display: grid; gap: 1px; min-width: 0; }
.lu-proj .k { font-size: 11px; color: var(--muted); white-space: nowrap; }
.lu-proj .v { font-family: var(--f-display); font-weight: 900; font-size: 30px; line-height: .95; font-variant-numeric: tabular-nums; }
.lu-proj .v2 { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lu-proj .pj { grid-template-columns: auto; justify-items: start; }
.lu-proj .pj .tag { margin-top: 3px; }
.lu-pitch { padding: 14px 6px 12px; display: grid; gap: 9px; background: repeating-linear-gradient(180deg, var(--pitch-a) 0 60px, var(--pitch-b) 60px 120px); flex: 1; }
.lu-row { display: flex; justify-content: center; gap: 4px; }
.lu-row.bench { padding-top: 10px; border-top: 1px dashed var(--pitch-line); }
.lu-slot { position: relative; flex: 0 1 82px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; text-align: center; }
.lu-slot .kit { display: grid; gap: 0; padding: 4px 3px 3px; background: var(--k1); color: var(--kt); border-bottom: 3px solid var(--k2); border-radius: 7px 7px 0 0; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .08); }
.lu-slot .code { font-size: 9.5px; font-weight: 800; letter-spacing: .06em; opacity: .85; }
.lu-slot .n { font-size: 12px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.lu-slot .sub { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3px 4px; padding: 4px 2px 5px; }

<script>
'use strict';
/* ================= Constants & state ================= */
const POS = { 1: 'GK', 2: 'DEF', 3: 'MID', 4: 'FWD' };
const POS_LONG = { 1: 'Goalkeeper', 2: 'Defender', 3: 'Midfielder', 4: 'Forward' };
const CHIPS = { wildcard: ['WC', 'Wildcard'], freehit: ['FH', 'Free Hit'], bboost: ['BB', 'Bench Boost'], '3xc': ['TC', 'Triple Captain'], manager: ['AM', 'Assistant Manager'] };
const chipShort = c => c ? (CHIPS[c] ? CHIPS[c][0] : String(c).toUpperCase()) : '';
const chipLong = c => c ? (CHIPS[c] ? CHIPS[c][1] : String(c)) : '';
const EMPTY_EDITS = () => ({ v: 1, plans: {}, pending: [], hidden: [] });
// OPEN: the public copy of this page (GitHub Pages + the club's Google Sheet backend) rather than the Claude artifact.
const OPEN = !!(window.claude && window.claude.open);

const S = {
  d: null, edits: EMPTY_EDITS(), tab: 'table', sort: 'gw', mode: 'actual', q: '',
  ownPos: 0, ownSort: 'own', ownAll: false, ownOpen: null, cmpA: null, cmpB: null,
  art: null, canWrite: false, sheet: null, unsaved: null, loadError: null,
  luFx: 1, lq: '', luMode: 'three', lu3: [], xpSrc: 'Solio', luOpt: true, sample: null, imgLimits: null, canRead: false, reading: null, uploadFor: null
};
let P = new Map(), T = new Map(), FX = {}, M = [], META = {}, ALL = [], XP = new Map(), XPMETA = null, XPS = [];

const store = {
  get(k, d) { try { const v = localStorage.getItem('mozf:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mozf:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
};

/* ================= Helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sum = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
const fold = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ø/g, 'o').replace(/ß/g, 'ss').toLowerCase();
const fmtM = v => v == null ? '—' : '£' + (v / 10).toFixed(1) + 'm';
const fmtInt = n => n == null ? '—' : Number(n).toLocaleString('en-GB');
const fmtRank = n => !n ? '—' : n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'K' : fmtInt(n);
const fmtWhen = iso => { try { return new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }).format(new Date(iso)); } catch (e) { return iso; } };
const fmtAgo = iso => { const s = (Date.now() - new Date(iso)) / 1000; if (s < 90) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; return Math.round(s / 86400) + ' d ago'; };
function countdown(iso) {
  const ms = new Date(iso) - Date.now(); if (ms <= 0) return null;
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
function parseFlag(s) {
  if (!s) return null;
  const m = /^([a-z])(\d*):?(.*)$/.exec(s) || [];
  const st = m[1] || s[0], chance = m[2] ? +m[2] : null, news = m[3] || '';
  const label = st === 'd' ? `${chance == null ? 75 : chance}% chance` : st === 'i' ? 'Injured' : st === 's' ? 'Suspended' : st === 'u' ? 'Unavailable' : 'Not available';
  return { st, chance, news, label, sev: st === 'd' ? 'warn' : (st === 'i' || st === 's') ? 'bad' : 'off' };
}
const flagDot = p => p && p.flag ? `<span class="dot ${p.flag.sev}" title="${esc(p.flag.news || p.flag.label)}"></span>` : '';
const tshort = id => (T.get(id) || {}).short || '?';
function nextFx(teamId, gw) { return (FX[teamId] || []).filter(f => f[0] === gw); }
function fxChip(f) { return `<span class="fx fdr${f[3]}" title="GW${f[0]} ${f[2] ? 'home to' : 'away at'} ${esc((T.get(f[1]) || {}).name || '')} · difficulty ${f[3]}">${tshort(f[1])} ${f[2] ? 'H' : 'A'}</span>`; }
function fxNext(p, gw) { const f = nextFx(p.team, gw); return f.length ? f.map(fxChip).join('') : '<span class="fx fdr3" title="No fixture">Blank</span>'; }
function fxRun(p, n = 3) { return (FX[p.team] || []).slice(0, n).map(fxChip).join(' '); }
function niceStep(max) { const raw = max / 4; const mag = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / mag; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag; }

/* ================= Data ================= */
function indexData() {
  const d = S.d; META = d.meta || {};
  P = new Map(d.players.map(a => [a[0], { id: a[0], name: a[1], team: a[2], pos: a[3], cost: a[4], total: a[5], form: a[6] / 10, sel: a[7] / 10, ep: a[8] / 10, gw: a[9], flag: parseFlag(a[10]) }]));
  T = new Map(d.teams.map(t => [t[0], { id: t[0], short: t[1], name: t[2] }]));
  FX = d.fixtures || {};
  XPS = (d.xpSources || (d.xp ? [d.xp] : [])).filter(x => x && Array.isArray(x.rows));
  setXpSource(S.xpSrc);
  const hidden = new Set((S.edits.hidden || []).map(Number));
  ALL = (d.managers || []).map(m => m.err ? m : enrich(m));
  M = ALL.filter(m => !m.err && !hidden.has(m.id));
}
function setXpSource(name) {
  XPMETA = XPS.find(x => x.source === name) || XPS[0] || null; XP = new Map();
  if (XPMETA) XPMETA.rows.forEach(r => { const o = {}; XPMETA.gws.forEach((g, k) => { o[g] = r[k + 1] / 10; }); XP.set(r[0], o); });
}
function enrich(m) {
  const H = (m.hist || []).map(h => ({ gw: h[0], pts: h[1], total: h[2], rank: h[3], or: h[4], tr: h[5], hit: h[6], bench: h[7], value: h[8], bank: h[9], net: h[1] - h[6] }));
  const last = H.find(h => h.gw === META.gw) || null;
  const prev = H.filter(h => h.gw < META.gw).pop() || null;
  const recent = H.slice(-3);
  const parts = String(m.mgr || '').split(/\s+/).filter(Boolean);
  const hp = String(m.handle || '').split(/\s+/).filter(Boolean);
  const short = m.handle ? (m.handle[0] === '@' ? m.handle.slice(1) : hp.length > 1 ? `${hp[0]} ${hp[hp.length - 1][0]}.` : hp[0])
    : parts.length > 1 ? `${parts[0]} ${parts[parts.length - 1][0]}.` : (parts[0] || m.team || '#' + m.id);
  const who = m.handle && m.handle !== m.mgr ? `${m.handle} · ${m.mgr}` : (m.mgr || '');
  return {
    ...m, H, last, prev, short, who,
    gwNet: last ? last.net : null, gwGross: last ? last.pts : null, hit: last ? last.hit : 0,
    form: recent.length ? sum(recent, h => h.net) / recent.length : 0,
    total: m.ovPts != null ? m.ovPts : (last ? last.total : 0),
    or: m.ovRank || (last && last.or) || null, orPrev: prev ? prev.or : null,
    value: last ? last.value : m.value, bank: last ? last.bank : m.bank,
    seasonTr: sum(H, h => h.tr), seasonHits: sum(H, h => h.hit), seasonBench: sum(H, h => h.bench),
    actual: m.picks ? buildActual(m) : null
  };
}
function buildActual(m) {
  const picks = [...m.picks].sort((a, b) => a[1] - b[1]);
  const mult = {}; picks.forEach(p => mult[p[0]] = p[2]);
  const subIn = new Set((m.subs || []).map(s => s[0])), subOut = new Set((m.subs || []).map(s => s[1]));
  subIn.forEach(id => { if (!mult[id]) mult[id] = 1; }); subOut.forEach(id => { mult[id] = 0; });
  const c = (picks.find(p => p[3]) || [])[0] || null, vc = (picks.find(p => p[4]) || [])[0] || null;
  return { src: 'actual', gw: META.gw, ids: picks.map(p => p[0]), mult, c, vc, chip: m.chip || null, subIn, subOut };
}
function netTr(tr) {
  const c = new Map(); (tr || []).forEach(([i, o]) => { c.set(i, (c.get(i) || 0) + 1); c.set(o, (c.get(o) || 0) - 1); });
  const ins = [], outs = []; c.forEach((v, k) => { if (v > 0) ins.push(k); if (v < 0) outs.push(k); });
  const byPos = (a, b) => ((P.get(a) || {}).pos || 0) - ((P.get(b) || {}).pos || 0);
  return { ins: ins.sort(byPos), outs: outs.sort(byPos) };
}
function planOf(m) { const p = S.edits.plans && S.edits.plans[m.id]; return p && META.next && p.gw >= META.next ? p : null; }
function planSquad(p) {
  const ids = [...p.picks], mult = {};
  ids.forEach((id, i) => { mult[id] = i < 11 ? (id === p.c ? (p.chip === '3xc' ? 3 : 2) : 1) : (p.chip === 'bboost' ? 1 : 0); });
  return { src: 'plan', gw: p.gw, ids, mult, c: p.c, vc: p.vc, chip: p.chip || null, note: p.note || '', at: p.at, subIn: new Set(), subOut: new Set() };
}
function squadOf(m, mode) { if ((mode || S.mode) === 'plan' && META.next && m.actual) return lineupView(m); return m.actual; }
function ownership(mode) {
  const own = new Map();
  for (const m of M) {
    const s = squadOf(m, mode); if (!s) continue;
    s.ids.forEach((id, i) => {
      let o = own.get(id); if (!o) { o = { id, n: 0, start: 0, cap: 0, owners: [] }; own.set(id, o); }
      o.n++; if (i < 11) o.start++; if (id === s.c) o.cap++; o.owners.push(m.id);
    });
  }
  return own;
}
const byGW = (a, b) => ((b.gwNet == null ? -999 : b.gwNet) - (a.gwNet == null ? -999 : a.gwNet)) || (b.total - a.total);
const SORTS = {
  gw: ['GW points', byGW],
  form: ['Form (last 3)', (a, b) => b.form - a.form || b.total - a.total],
  or: ['Overall rank', (a, b) => (a.or || 9e9) - (b.or || 9e9)],
  xp: ['Next GW expected points', (a, b) => projNet(b) - projNet(a)]
};
const findM = id => M.find(m => m.id === +id) || ALL.find(m => m.id === +id);
const modeLabel = mode => mode === 'plan' ? `GW${META.next} lineups` : `GW${META.gw} teams`;
const ptsOf = (s, id) => { const p = P.get(id); return p ? p.gw * (s.mult[id] == null ? 1 : s.mult[id]) : 0; };

/* ================= Hero ================= */
function renderHero() {
  const ranked = [...M].sort(byGW);
  const vals = ranked.map(m => m.gwNet || 0);
  const max = Math.max(...vals, 1), min = Math.min(...vals, max);
  const pending = (S.edits.pending || []).filter(id => !ALL.some(m => m.id === +id));
  const slots = Math.max(16, ranked.length + pending.length);
  let html = '';
  for (let i = 0; i < slots; i++) {
    const m = ranked[i];
    if (m) {
      const h = max === min ? .5 : (m.gwNet - min) / (max - min);
      const hv = (.1 + .9 * h).toFixed(3);
      html += `<button class="tile" style="--h:${hv};--i:${i};${discoVars(i, +hv)}" data-action="open" data-id="${m.id}" title="${esc(m.team)} — ${esc(m.who)}: ${m.gwNet} pts">
        <span class="rk">${i + 1}</span><span><span class="pt">${m.gwNet == null ? '–' : m.gwNet}</span><span class="nm">${esc(m.short)}</span></span></button>`;
    } else {
      const pid = pending[i - ranked.length];
      html += `<div class="tile empty" style="--i:${i}"><span class="rk">${i + 1}</span><span class="nm">${pid ? 'ID ' + esc(pid) + '<br>next sync' : 'Open spot'}</span></div>`;
    }
  }
  $('#floor').innerHTML = html;
  $('#floorcap').textContent = M.length ? `GW${META.gw} points, brightest = top score. Tap a tile for the squad.` : 'Tiles light up once the team’s FPL IDs are synced.';

  const status = [];
  status.push(`<span class="pill ${META.gwFinished ? '' : 'live'}">GW${META.gw} · ${META.gwFinished ? 'final' : 'in progress'}</span>`);
  if (META.next && META.deadline) {
    const cd = countdown(META.deadline);
    status.push(`<span class="pill gold" id="deadline">GW${META.next} deadline ${esc(fmtWhen(META.deadline))}${cd ? ' · in ' + cd : ' · passed, waiting for sync'}</span>`);
  }
  if (META.synced) status.push(`<span class="pill" title="${esc(fmtWhen(META.synced))}">Synced ${esc(fmtAgo(META.synced))}</span>`);
  $('#status').innerHTML = status.join('');

  if (!M.length) { $('#clubstats').innerHTML = ''; return; }
  const avg = Math.round(sum(M, m => m.gwNet) / M.length);
  const best = ranked[0], low = ranked[ranked.length - 1];
  const diff = META.gwAvg != null ? avg - META.gwAvg : null;
  $('#clubstats').innerHTML = `
    <div class="stat"><div class="k">Team average</div><div class="v">${avg}${diff != null ? `<small>${diff >= 0 ? '+' : ''}${diff} vs FPL ${META.gwAvg}</small>` : ''}</div></div>
    <div class="stat"><div class="k">Top score</div><div class="v">${best.gwNet}</div><div class="who">${esc(best.short)}</div></div>
    <div class="stat"><div class="k">Lowest</div><div class="v">${low.gwNet}</div><div class="who">${esc(low.short)}</div></div>`;
}

/* ================= Tabs & chrome ================= */
function renderTabs() {
  const skTab = document.querySelector('.tab[data-tab="sklw"]'); if (skTab) skTab.hidden = !OPEN;

function clubAvgByGW() {
  const map = new Map();
  M.forEach(m => m.H.forEach(h => { const e = map.get(h.gw) || [0, 0]; e[0] += h.net; e[1]++; map.set(h.gw, e); }));
  return map;
}
function gwChart(A, B, proj) {
  const gws = [...new Set([...A.H, ...B.H].map(h => h.gw))].sort((a, b) => a - b);
  if (!gws.length && !proj) return '<p class="muted">No gameweeks played yet.</p>';
  const avg = clubAvgByGW();
  const va = new Map(A.H.map(h => [h.gw, h.net])), vb = new Map(B.H.map(h => [h.gw, h.net]));
  const nxt = proj && META.next && !gws.includes(META.next) ? META.next : null;
  if (nxt) {
    gws.push(nxt);
    va.set(nxt, Math.round(projNet(A) * 10) / 10); vb.set(nxt, Math.round(projNet(B) * 10) / 10);
    const all = M.filter(m => m.actual).map(projNet);
    if (all.length) avg.set(nxt, [all.reduce((t, v) => t + v, 0), all.length]);
  }
  const max = Math.max(10, ...gws.map(g => Math.max(va.get(g) || 0, vb.get(g) || 0, (avg.get(g) || [0, 1])[0] / (avg.get(g) || [0, 1])[1])));
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const L = 34, R = 8, Tp = 10, Bt = 24, bw = 16, gap = 2, gw = Math.max(44, (560 - 42) / gws.length);
  const W = L + R + gws.length * gw, H = 200, ph = H - Tp - Bt;
  const y = v => Tp + ph - Math.max(0, v) / top * ph;
  let g = '<g class="grid">';
  for (let t = 0; t <= top + 1e-9; t += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`;
  g += '</g><g class="ax">';
  for (let t = 0; t <= top + 1e-9; t += step) g += `<text x="${L - 6}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`;
  gws.forEach((w, i) => { g += `<text x="${(L + i * gw + gw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">GW${w}${w === nxt ? ' xP' : ''}</text>`; });
  g += '</g>';
  let bars = '', pts = [];
  gws.forEach((w, i) => {
    const cx = L + i * gw + gw / 2, a = va.get(w), b = vb.get(w);
    const pc = w === nxt ? ' proj' : '';
    if (a != null) bars += `<rect class="a${pc}" x="${(cx - bw - gap / 2).toFixed(1)}" y="${y(a).toFixed(1)}" width="${bw}" height="${(Tp + ph - y(a)).toFixed(1)}" rx="3"><title>${esc(A.short)} GW${w}${w === nxt ? ' expected' : ''}: ${a}</title></rect>`;
    if (b != null) bars += `<rect class="b${pc}" x="${(cx + gap / 2).toFixed(1)}" y="${y(b).toFixed(1)}" width="${bw}" height="${(Tp + ph - y(b)).toFixed(1)}" rx="3"><title>${esc(B.short)} GW${w}${w === nxt ? ' expected' : ''}: ${b}</title></rect>`;
    const e = avg.get(w); if (e) pts.push([cx, y(e[0] / e[1]), Math.round(e[0] / e[1]), w]);
  });
  const ref = pts.length > 1 ? `<polyline class="ref" points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>` : '';
  const hov = pts.map(p => `<rect class="hov" x="${(p[0] - gw / 2).toFixed(1)}" y="${Tp}" width="${gw}" height="${ph}"><title>GW${p[3]} — ${esc(A.short)} ${va.get(p[3]) ?? '–'}, ${esc(B.short)} ${vb.get(p[3]) ?? '–'}, team avg ${p[2]}</title></rect>`).join('');
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 520)}px" role="img" aria-label="Points by gameweek for ${esc(A.short)} and ${esc(B.short)}">${g}${bars}${ref}${hov}</svg></div>`;

function overlap(A, B, sA, sB) {
  if (!sA || !sB) return '<p class="muted">One of these managers has no squad to compare.</p>';
  const setB = new Set(sB.ids), setA = new Set(sA.ids);

  const startersShared = shared.filter(id => sA.ids.indexOf(id) < 11 && sB.ids.indexOf(id) < 11).length;
  const isPlan = S.mode === 'plan';
  const bA = id => sA.ids.indexOf(id) >= 11, bB = id => sB.ids.indexOf(id) >= 11;
  // benchOf: is this player benched in the list's squad(s)? For "Both", only dim when both bench him; flag it when one does.
  const li = (id, s, both) => {
    const p = P.get(id); if (!p) return '';
    const benched = both ? bA(id) && bB(id) : s.ids.indexOf(id) >= 11;
    const partly = both && !benched && (bA(id) || bB(id)) ? (bA(id) ? A.short : B.short) : '';
    const cap = both ? [sA.c === id ? A.short : '', sB.c === id ? B.short : ''].filter(Boolean) : (id === s.c ? ['C'] : []);
    const capTxt = !cap.length ? '' : both ? ` (C ${cap.length === 2 ? 'both' : esc(cap[0])})` : ' (C)';
    return `<li class="${benched ? 'bench' : ''}${partly ? ' part' : ''}" title="${esc(POS_LONG[p.pos])}, ${esc((T.get(p.team) || {}).name || '')}${benched ? ' · on the bench' : partly ? ' · on ' + esc(partly) + '’s bench' : ''}"><span class="n"><span class="pos">${POS[p.pos]}</span>${esc(p.name)}${capTxt}${benched ? ' <span class="muted">· bench</span>' : partly ? ` <span class="bt">· ${esc(partly)} bench</span>` : ''}</span><span class="num">${isPlan ? `${fxNext(p, META.next)} ${xpOf(id).toFixed(1)}` : ptsOf(s, id)}</span></li>`;
  };
  const sortPos = (ids) => [...ids].sort((x, y) => (P.get(x) || {}).pos - (P.get(y) || {}).pos);
  const list = (ids, s, both) => {
    const isB = id => both ? bA(id) && bB(id) : s.ids.indexOf(id) >= 11;
    const on = sortPos(ids.filter(id => !isB(id))), off = sortPos(ids.filter(isB));
    return [...on.map(id => li(id, s, both)), off.length && on.length ? '<li class="sep" aria-hidden="true">Bench</li>' : '', ...off.map(id => li(id, s, both))].join('') || '<li>Nobody</li>';
  };

  // counting starters with the captain's multiplier; bench shown separately (it only scores with Bench Boost).
  const worth = (ids, s) => {

    ids.forEach(id => {
      const i = s.ids.indexOf(id); if (i < 0) return;
      if (isPlan) { const x = xpOf(id), mult = i < 11 ? (id === s.c ? (s.chip === '3xc' ? 3 : 2) : 1) : 0; if (i < 11) xi += x * mult; else bench += x; }
      else { if (i < 11 || (s.mult[id] || 0) > 0) xi += ptsOf(s, id); else bench += P.get(id) ? P.get(id).gw : 0; }

  const fmtW = v => isPlan ? v.toFixed(1) : String(Math.round(v));
  const unit = isPlan ? `GW${META.next} xP` : `GW${META.gw} points`;
  const totBox = (ids, s, who) => {
    if (!ids.length) return '';

    return `<div class="tot"><span>${who ? esc(who) + ' · ' : ''}${unit}<small>starters${isPlan ? ', captain doubled' : ''}${w.bench ? ` · bench ${fmtW(w.bench)}` : ''}</small></span><b>${fmtW(w.xi)}</b></div>`;
  };
  const totBoth = () => {
    if (!shared.length) return '';
    const wa = worth(shared, sA), wb = worth(shared, sB);
    return fmtW(wa.xi) === fmtW(wb.xi) && fmtW(wa.bench) === fmtW(wb.bench) ? totBox(shared, sA) : totBox(shared, sA, A.short) + totBox(shared, sB, B.short);
  };
  return `<h3>Squad overlap</h3>
    <div style="display:flex;gap:18px;align-items:end;flex-wrap:wrap;margin-bottom:14px"><span class="share num">${shared.length}<span class="muted" style="font-size:20px">/15</span></span><span class="muted" style="font-size:13.5px;max-width:48ch">players in both squads, ${startersShared} of them starting for both. The players below are where these two can gain or lose ground on each other.</span></div>
    <div class="ovl">
      <div><h4><span class="sw a"></span>Only ${esc(A.short)}</h4><ul>${list(onlyA, sA)}</ul>${totBox(onlyA, sA)}</div>
      <div><h4>Both</h4><ul>${list(shared, sA, true)}</ul>${totBoth()}</div>
      <div><h4><span class="sw b"></span>Only ${esc(B.short)}</h4><ul>${list(onlyB, sB)}</ul>${totBox(onlyB, sB)}</div>

/* ================= Back button =================
   Each tab change, opened panel and lineup editor is a browser history entry, so the phone's back
   button steps back through them: editor → panel → previous tab. */
let navSkip = 0;
const navTop = () => { const st = history.state; return st && st.mozf ? st : null; };
function navPush(extra) { try { history.pushState(Object.assign({ mozf: 1, tab: S.tab }, extra || {}), '', '#' + S.tab); } catch (e) { /* history unavailable */ } }
function navReplace() { try { history.replaceState({ mozf: 1, tab: S.tab }, '', '#' + S.tab); } catch (e) { /* history unavailable */ } }
// The page closed a layer itself (close button, Save, Cancel): drop its history entries so back doesn't stall on them.
function navDrop(layers) {
  const st = navTop(); if (!st || !st.layer) return;
  const depth = st.layer === 'edit' ? 2 : 1, n = Math.min(depth, layers);
  if (n > 0) { navSkip++; try { history.go(-n); } catch (e) { navSkip--; } }
}
function editDirty() {
  const e = S.sheet && S.sheet.edit; if (!e) return false;
  if (e.src === 'screenshot') return true;
  const m = findM(S.sheet.id), plan = m && planOf(m), b = plan ? planSquad(plan) : m && lineupView(m);
  if (!b) return false;
  return JSON.stringify(e.ids) !== JSON.stringify(b.ids) || e.c !== b.c || e.vc !== b.vc || (e.chip || '') !== ((plan && plan.chip) || '') || (+e.hit || 0) !== (plan ? +plan.hit || 0 : 0) || (e.note || '') !== ((plan && plan.note) || '');
}
function exitEdit() { if (!S.sheet) return; S.sheet.edit = null; S.sheet.slot = null; S.sheet.picker = false; navDrop(1); }
window.addEventListener('popstate', ev => {
  if (navSkip) { navSkip--; return; }
  const st = ev.state && ev.state.mozf ? ev.state : { tab: (location.hash || '').slice(1) };
  const layer = st.layer || null;
  if (S.sheet && S.sheet.edit && layer !== 'edit') {
    // Back while editing: close the player picker or hit question first, and never throw away unsaved changes.
    const e = S.sheet.edit;
    if (S.sheet.slot != null || e.askHit) { S.sheet.slot = null; S.sheet.picker = false; e.askHit = false; navPush({ layer: 'edit', kind: S.sheet.kind, id: S.sheet.id }); renderSheet(); return; }
    if (editDirty()) { navPush({ layer: 'edit', kind: S.sheet.kind, id: S.sheet.id }); toast('You have unsaved changes. Tap Save lineup, or Cancel to discard them.'); return; }
    S.sheet.edit = null; S.sheet.slot = null; S.sheet.picker = false;
    if (layer === 'sheet') { renderSheet(); return; }
  }
  if (S.sheet && !layer) closeSheet(true);
  else if (!S.sheet && layer && st.kind === 'mgr' && findM(st.id)) { openSheet(st.id, null, true); if (layer === 'edit') navReplaceLayer('sheet'); }
  else if (!S.sheet && layer && st.kind === 'roster') openRoster(true);
  const tab = ['table', 'sklw', 'lineups', 'vote', 'squads', 'compare', 'ownership'].includes(st.tab) ? st.tab : 'table';
  if (tab !== S.tab) { S.tab = tab; store.set('tab', S.tab); render(); viewTop(); }
});
// After switching tabs, start the new view at its top (just under the hero) if the page was scrolled past it.
function viewTop() { const sky = document.querySelector('.sky'), y = sky ? sky.offsetHeight : 0; if (window.scrollY > y) window.scrollTo(0, y); }

function histChart(m) {
  const H = m.H; if (!H.length) return '';
  const avg = clubAvgByGW();
  const max = Math.max(10, ...H.map(h => h.net), ...H.map(h => { const e = avg.get(h.gw); return e ? e[0] / e[1] : 0; }));
  const step = niceStep(max), top = Math.ceil(max / step) * step;
  const L = 28, R = 6, Tp = 8, Bt = 20, gw = 34, bw = 22, W = Math.max(540, L + R + H.length * gw), Hh = 170, ph = Hh - Tp - Bt;
  const colW = (W - L - R) / H.length;
  const y = v => Tp + ph - Math.max(0, v) / top * ph;
  let s = '<g class="grid">';
  for (let t = 0; t <= top + 1e-9; t += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`;
  s += '</g><g class="ax">';
  for (let t = 0; t <= top + 1e-9; t += step) s += `<text x="${L - 5}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${Math.round(t)}</text>`;
  H.forEach((h, i) => s += `<text x="${(L + i * colW + colW / 2).toFixed(1)}" y="${Hh - 5}" text-anchor="middle">${h.gw}</text>`);
  s += '</g>';
  const pts = [];
  H.forEach((h, i) => {
    const cx = L + i * colW + colW / 2, bwi = Math.min(bw, colW - 6);
    s += `<rect class="one" x="${(cx - bwi / 2).toFixed(1)}" y="${y(h.net).toFixed(1)}" width="${bwi.toFixed(1)}" height="${(Tp + ph - y(h.net)).toFixed(1)}" rx="3"><title>GW${h.gw}: ${h.net}${h.hit ? ` (after −${h.hit} hit)` : ''}</title></rect>`;
    const e = avg.get(h.gw); if (e) pts.push(`${cx.toFixed(1)},${y(e[0] / e[1]).toFixed(1)}`);
  });
  if (pts.length > 1) s += `<polyline class="ref" points="${pts.join(' ')}"/>`;
  return `<div class="chart histchart"><div class="lgd"><span><span class="sw" style="background:var(--accent-strong)"></span>Points per GW</span><span><span class="refk"></span>Team average</span></div><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Points per gameweek">${s}</svg></div>`;
}

function validate(e, m) {
  const errs = [], warns = [];
  const st = e.ids.slice(0, 11).map(id => P.get(id));
  const cnt = k => st.filter(p => p && p.pos === k).length;
  if (cnt(1) !== 1) errs.push('The starting XI needs exactly one goalkeeper.');
  if (cnt(2) < 3) errs.push('Start at least 3 defenders.');
  if (cnt(3) < 2) errs.push('Start at least 2 midfielders.');
  if (cnt(4) < 1) errs.push('Start at least 1 forward.');
  if (!e.c || e.ids.indexOf(e.c) > 10) errs.push('Pick a captain from the starting XI.');
  if (e.vc && e.ids.indexOf(e.vc) > 10) warns.push('The vice-captain is on the bench.');
  if (e.c && e.c === e.vc) errs.push('Captain and vice-captain must be different players.');
  const clubs = {}; e.ids.forEach(id => { const p = P.get(id); if (p) clubs[p.team] = (clubs[p.team] || 0) + 1; });
  Object.entries(clubs).filter(([, n]) => n > 3).forEach(([t, n]) => warns.push(`${n} players from ${esc((T.get(+t) || {}).name)}. FPL allows 3 per club.`));
  const cost = sum(e.ids, id => (P.get(id) || {}).cost), budget = (m.value || 0) + (m.bank || 0);
  if (budget && cost > budget) warns.push(`About ${fmtM(cost - budget)} over budget at today’s prices. Sale prices can differ, so check in FPL.`);
  const changed = e.ids.filter(id => !e.orig.has(id)).length;
  return { errs, warns, changed, cost, budget };
}

    await S.art.publish({ 'data/edits.json': JSON.stringify(next) });
    S.edits = next; try { sessionStorage.removeItem('mozf:pending-save'); } catch (e) { /* ignore */ }
    indexData(); toast(okMsg); return true;
  } catch (err) {
    const c = err && err.code;
    if (c === 'cancelled') { /* club code prompt closed */ }
    else if (c === 'bad_code') toast('That club code didn’t work. Ask in the group for the right one.');
    else if (c === 'conflict') toast('Someone updated the page at the same moment. Reloading the latest version…');
    else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'not_declared', 'capability_removed'].includes(c)) { S.canWrite = false; try { sessionStorage.removeItem('mozf:pending-save'); } catch (e) { /* ignore */ } toast('This view is read-only, so changes can’t be saved here.'); render(); }
    else if (c === 'rate_limited') toast('Too many saves in a row. Wait a few seconds, then save again.');

}

  if (v.ok) doSwap(d.i, j); else if (v.why) toast(v.why);
});
document.addEventListener('pointercancel', () => { if (drag) { dragCleanup(drag); drag = null; } });

document.addEventListener('click', ev => {
  if (Date.now() - dragEndedAt < 350 && ev.target.closest && ev.target.closest('button.slot')) { ev.preventDefault(); return; }
  const t = ev.target.closest('[data-action]'); if (!t || t.disabled) return;
  const a = t.dataset.action; if (ACT[a]) { if (t.tagName === 'A') return; ev.preventDefault(); ACT[a](t, ev); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.sheet && S.sheet.edit && S.sheet.edit.askHit) { S.sheet.edit.askHit = false; renderSheet(); return; }
  if (ev.key === 'Escape' && S.sheet) { if (S.sheet.slot != null) { S.sheet.slot = null; S.sheet.picker = false; renderSheet(); } else closeSheet(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr[data-action]')) { ev.preventDefault(); ACT[ev.target.dataset.action](ev.target, ev); }
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset.input; if (!k) return;
  if (k === 'sq') { S.q = ev.target.value; renderSquadGrid(); }
  if (k === 'lu') { S.lq = ev.target.value; renderLineupGrid(); }
  if (k === 'pq') { S.sheet.pq = ev.target.value; const pl = $('#plist'); if (pl) pl.innerHTML = pickerList(P.get(S.sheet.edit.ids[S.sheet.slot])); }
  if (k === 'plannote') { S.sheet.edit.note = ev.target.value; }
});
document.addEventListener('change', ev => {
  const k = ev.target.dataset.change; if (!k) return;
  const v = ev.target.value;
  if (k === 'sklg') { if (S.sk) { S.sk.view = v; renderView(); } return; }
  if (k === 'sort') { S.sort = v; store.set('sort2', v); renderView(); }
  if (k === 'cmpA' || k === 'cmpB') { S[k] = +v; if (S.cmpA === S.cmpB) { const other = M.find(m => m.id !== S[k]); S[k === 'cmpA' ? 'cmpB' : 'cmpA'] = other.id; } store.set('cmp', [S.cmpA, S.cmpB]); renderView(); }
  if (k === 'ownSort') { S.ownSort = v; renderView(); }
  if (k === 'lu3') {
    const ids = lu3Ids(), slot = +ev.target.dataset.slot, nid = +v, other = ids.indexOf(nid);
    if (other >= 0 && other !== slot) ids[other] = ids[slot];
    ids[slot] = nid; S.lu3 = ids; store.set('lu3', ids); renderLineupGrid();
    const sel = $('#lu3-' + slot); if (sel) sel.focus();
  }
  if (k === 'planchip') { S.sheet.edit.chip = v; renderSheet(); }
  if (k === 'vslot') {
    const r = ev.target.dataset.r, i = +ev.target.dataset.i, id = v ? +v : null, d = S.voteDraft;
    if (id) ROLES.forEach(o => { if (o.k !== r) d[o.k] = d[o.k].filter(x => x !== id); });
    const arr = [...d[r]]; if (id && arr.includes(id)) arr.splice(arr.indexOf(id), 1, undefined);
    arr[i] = id || undefined; d[r] = arr.filter(Boolean);
    S.voteDirty = true; renderView();
    const again = $(`#vp-${r}-${Math.min(i, d[r].length)}`); if (again) again.focus();
  }
  if (k === 'voteas') { S.voteAs = v ? +v : null; store.set('voteas', S.voteAs); seedVoteDraft(); renderView(); }
  if (k === 'planhit') { S.sheet.edit.hit = +v || 0; renderSheet(); }
});
const dropCard = ev => (ev.target && ev.target.closest) ? ev.target.closest('[data-drop]') : null;
document.addEventListener('dragover', ev => { const c = dropCard(ev); if (c && S.canWrite && S.canRead && !S.reading) { ev.preventDefault(); c.classList.add('drop'); } });
document.addEventListener('dragleave', ev => { const c = dropCard(ev); if (c && !c.contains(ev.relatedTarget)) c.classList.remove('drop'); });
document.addEventListener('drop', ev => {
  const c = dropCard(ev); if (!c) return; ev.preventDefault(); c.classList.remove('drop');
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0]; if (f) readShot(+c.dataset.drop, f);
});
document.addEventListener('paste', ev => {
  if (!S.sheet || S.sheet.kind !== 'mgr' || !S.canRead || !S.canWrite || ev.target.matches('input, textarea')) return;
  const f = [...((ev.clipboardData && ev.clipboardData.files) || [])].find(x => /^image\//.test(x.type));
  if (f) { ev.preventDefault(); readShot(S.sheet.id, f); }
});
document.addEventListener('submit', ev => {
  const f = ev.target.closest('[data-form="addid"]'); if (!f) return; ev.preventDefault();
  const inp = $('#newid'); const raw = (inp.value || '').trim();
  const m = /(?:entry\/)?(\d{1,9})/.exec(raw);
  if (!m) { toast('Enter the number from the FPL points link, e.g. 1234567.'); return; }
  const id = m[1];
  if (ALL.some(x => x.id === +id) || S.sheet.draft.pending.includes(id)) { toast(`ID ${id} is already on the list.`); return; }
  S.sheet.draft.pending.push(id); renderSheet(); const n = $('#newid'); if (n) n.focus();
});

/* ================= Boot ================= */
async function boot() {
  S.tab = ['table', 'sklw', 'lineups', 'vote', 'squads', 'compare', 'ownership'].includes((location.hash || '').slice(1)) ? location.hash.slice(1) : store.get('tab', 'table');
  navReplace();
  S.sort = store.get('sort2', 'or'); if (!SORTS[S.sort]) S.sort = 'or';
  S.mode = store.get('mode2', 'plan');
  const cmp = store.get('cmp', []); S.cmpA = cmp[0] || null; S.cmpB = cmp[1] || null; S.luFx = store.get('lufx', 1) === 3 ? 3 : 1; S.luMode = store.get('lumode', 'three') === 'all' ? 'all' : 'three'; S.lu3 = store.get('lu3', []); S.xpSrc = store.get('xpsrc', 'Solio'); S.luOpt = store.get('luopt', true) !== false;
  render();
  try {
    const [d, e] = await Promise.all([
      fetch('data/fpl.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error('data/fpl.json answered ' + r.status); return r.json(); }),
      fetch('data/edits.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)
    ]);
    S.d = d; S.edits = Object.assign(EMPTY_EDITS(), e || {});
    if (!S.d.meta.next) S.mode = 'actual';
    indexData();
    try { const pend = sessionStorage.getItem('mozf:pending-save'); if (pend && pend !== JSON.stringify(S.edits)) S.unsaved = JSON.parse(pend); else if (pend) sessionStorage.removeItem('mozf:pending-save'); } catch (err) { /* ignore */ }
  } catch (err) { S.loadError = err.message || 'Unknown error'; }
  render();
  setInterval(() => { if (S.d && META.deadline) { const el = $('#deadline'); const cd = countdown(META.deadline); if (el) el.textContent = `GW${META.next} deadline ${fmtWhen(META.deadline)}${cd ? ' · in ' + cd : ' · passed, waiting for sync'}`; } }, 30000);
  // Light up editing once the viewer says this page can be saved.
  try {
    if (window.claude && window.claude.use) {
      const [art, user, sample] = await Promise.all([window.claude.use('artifact'), window.claude.use('user').catch(() => null), window.claude.use('sample').catch(() => null)]);
      S.art = art; S.sample = sample;
      if (sample) { try { S.imgLimits = await sample.limits(); } catch (e) { S.imgLimits = null; } }
      S.canRead = !!(S.imgLimits && S.imgLimits.images);
      let can = null;
      if (user) { try { can = await user.can('files.write'); } catch (e) { can = null; } if (can === null) { try { can = await user.canEdit(); } catch (e) { can = false; } } }
      S.canWrite = !!art && can !== false;
      render();
      startVotes(user);
    }
  } catch (err) { S.canWrite = false; }
}
async function startVotes(user) {
  try {
    const db = await window.claude.use('db');
    if (!db) { S.voteState = 'nodb'; if (S.tab === 'vote') renderView(); return; }
    S.db = db;
    if (user) { try { S.isOwner = await user.isOwner(); } catch (e) { S.isOwner = false; } try { S.uid = await user.id(); } catch (e) { S.uid = null; } try { S.dataWrite = await user.can('data.write'); } catch (e) { S.dataWrite = null; } }
    db.collection('votes').onSnapshot(snap => {
      S.votes = snap.docs.filter(d => d.exists).map(d => Object.assign({ _id: d.id }, d.data()));
      S.voteState = 'ready';
      if (S.tab === 'vote') { if (!S.voteDirty) seedVoteDraft(); renderView(); }
    }, err => { S.voteState = 'error'; S.voteErr = err && err.code; if (S.tab === 'vote') renderView(); });
  } catch (e) { S.voteState = 'nodb'; if (S.tab === 'vote') renderView(); }
}
boot();
